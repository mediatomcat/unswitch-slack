display_information:
  name: Unswitch
  description: Coming soon
  background_color: "#0d1015"

features:
  bot_user:
    display_name: Unswitch
    always_online: false

  slash_commands:
    - command: /unswitch
      url: https://example.com/slack/commands
      description: Unswitch command interface
      usage_hint: hello
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands

settings:
  interactivity:
    is_enabled: false

  event_subscriptions:
    bot_events:
      - app_mention

  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
